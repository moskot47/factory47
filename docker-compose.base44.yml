services:
  app:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    command: ["python3", "-m", "factory47.server"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000').read()"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
