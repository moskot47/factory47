services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    command: ["python", "-m", "factory47"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
